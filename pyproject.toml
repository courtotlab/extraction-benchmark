[project]
name = "extraction-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "argparse>=1.4.0",
    "async-graph-data-flow>=2.0.0",
    "easyocr>=1.7.2",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "ollama>=0.6.2",
    "openai>=2.36.0",
    "pandas>=3.0.2",
    "pdf2image>=1.17.0",
    "pyyaml>=6.0.3",
    "qwen-vl-utils>=0.0.14",
#    "torch>=2.11.0",
    "transformers>=4.45.0,<5.0.0",
]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.gpu.system-requirements]
cuda = "12.6"

[tool.pixi.feature.gpu.dependencies]
pytorch = ">=2.10"
#cuda-version = "12.6.*"

[tool.pixi.feature.cpu.dependencies]
pytorch = ">=2.10"

[tool.pixi.environments]
cpu = ["cpu"]
default = ["gpu"]

[tool.pixi.pypi-dependencies]
extraction-benchmark = { path = ".", editable = true }

[tool.pixi.dependencies]
r-base = ">=4.6.0,<4.7"

[project.scripts]
bench = "extraction_benchmark.main:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pandas-stubs>=3.0.0.260204",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.uv]
#ward against zero-days and supply chain attacks
exclude-newer = "1 week"

[tool.ruff]
indent-width = 2
lint.select = ["E", "F", "S"]

[tool.mypy]
disable_error_code = ["import-untyped"]
